[project]
name = "chemspace"
version = "0.1.0"
description = "Iterative chemical space exploration: select a region, switch the domain, re-cluster within the subset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "baaaam771" }]
dependencies = [
    "rdkit>=2024.3.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.6",
    "scipy>=1.13",
    "requests>=2.32",
    "plotly>=6.0",
    "anywidget>=0.9",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemspace"]
